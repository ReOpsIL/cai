<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agatston Score Calculator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Agatston Score Calculator</h1>
        <form id="scoreForm">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required><br>
            <label for="gender">Gender:</label>
            <select id="gender" name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select><br>
            <label for="calcium_score_lesion1">Calcium Score Lesion 1:</label>
            <input type="number" id="calcium_score_lesion1" name="calcium_score_lesion1" required><br>
            <button type="submit">Calculate Score</button>
        </form>
        <div id="result">
            <h2>Result:</h2>
            <p id="agatstonScore">Agatston Score: </p>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
