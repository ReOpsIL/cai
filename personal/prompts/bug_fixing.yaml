name: "Bug Fixing"
description: "Prompts for debugging and fixing code issues"
subjects:
  - name: "analysis"
    prompts:
      - title: "Root Cause Analysis"
        content: "Perform a systematic root cause analysis of the reported bug, examining all potential contributing factors."
        tags: ["debugging", "analysis", "root-cause"]
        
      - title: "Error Pattern Recognition"
        content: "Identify patterns in error logs and symptoms that might indicate the underlying issue."
        tags: ["debugging", "patterns", "logs"]

  - name: "resolution"
    prompts:
      - title: "Bug Fix Implementation"
        content: "Implement a robust fix for the identified bug, ensuring it doesn't introduce new issues."
        tags: ["fixing", "implementation"]
        
      - title: "Regression Prevention"
        content: "Design and implement measures to prevent this type of bug from recurring in the future."
        tags: ["fixing", "prevention", "testing"]

  - name: "validation"
    prompts:
      - title: "Fix Verification"
        content: "Thoroughly test the bug fix to ensure it resolves the issue without side effects."
        tags: ["testing", "validation"]
        
      - title: "Impact Assessment"
        content: "Assess the impact of the bug fix on the overall system and related components."
        tags: ["testing", "impact"]